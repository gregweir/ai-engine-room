name: One-time WinGet executable-discovery verification

on:
  pull_request:
    branches:
      - main
    types:
      - opened

permissions:
  contents: read

jobs:
  verify:
    name: Exact disposable-Windows feasibility run
    if: >-
      github.repository == 'gregweir/ai-engine-room' &&
      github.head_ref == 'codex/winget-executable-discovery-verification' &&
      github.event.pull_request.head.repo.full_name == 'gregweir/ai-engine-room'
    runs-on: windows-2025
    timeout-minutes: 10
    env:
      AER_WINGET_FEASIBILITY_APPROVED: 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Verify runner and reviewed procedure
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Set-StrictMode -Version Latest

          $os = Get-CimInstance Win32_OperatingSystem
          [ordered]@{
            runner_environment = $env:RUNNER_ENVIRONMENT
            runner_os = $env:RUNNER_OS
            runner_arch = $env:RUNNER_ARCH
            image_os = $env:ImageOS
            image_version = $env:ImageVersion
            windows_caption = $os.Caption
            windows_version = $os.Version
            windows_build = $os.BuildNumber
          } | ConvertTo-Json | Write-Host

          if ($env:RUNNER_ENVIRONMENT -ne 'github-hosted') {
            throw 'The runner is not GitHub-hosted.'
          }
          if ($env:RUNNER_OS -ne 'Windows' -or $env:RUNNER_ARCH -ne 'X64') {
            throw 'The runner is not Windows x64.'
          }
          if ($os.Caption -notmatch 'Windows Server 2025' -or $os.Version -ne '10.0.26100') {
            throw "Unexpected Windows runner identity: $($os.Caption) $($os.Version)."
          }

          $event = Get-Content -Raw -LiteralPath $env:GITHUB_EVENT_PATH | ConvertFrom-Json
          $actualHead = (git rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0 -or $actualHead -ne $event.pull_request.head.sha) {
            throw "Checked-out head mismatch: $actualHead."
          }
          $expectedParent = '0eb0787e4d7dde1192af6deb25f580ba197bea98'
          $actualParent = (git rev-parse 'HEAD^').Trim()
          if ($LASTEXITCODE -ne 0 -or $actualParent -ne $expectedParent) {
            throw "Execution commit parent mismatch: $actualParent."
          }
          $changedPaths = @(git diff --name-only $expectedParent HEAD)
          if ($LASTEXITCODE -ne 0 -or
              $changedPaths.Count -ne 1 -or
              $changedPaths[0] -ne '.github/workflows/winget-executable-discovery-verification.yml') {
            throw "Unexpected execution-branch changes: $($changedPaths -join ', ')."
          }

          $actualBlob = git hash-object -- 'scripts/verify-winget-silent-install.ps1'
          if ($LASTEXITCODE -ne 0) {
            throw 'Unable to calculate the reviewed procedure blob.'
          }
          $expectedBlob = '3e6142baf154656106b74c75a9fbeeefa570076b'
          if ($actualBlob.Trim() -ne $expectedBlob) {
            throw "Procedure blob mismatch: $($actualBlob.Trim())."
          }

      - name: Run the approved procedure once
        shell: pwsh
        run: ./scripts/verify-winget-silent-install.ps1
