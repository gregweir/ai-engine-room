name: One-time Snapcraft expansion and conditional build

on:
  pull_request:
    branches:
      - main
    types:
      - opened

permissions:
  contents: read

jobs:
  verify:
    name: Exact disposable-Ubuntu Snapcraft run
    if: >-
      github.repository == 'gregweir/ai-engine-room' &&
      github.head_ref == 'codex/snapcraft-one-build-execution' &&
      github.event.pull_request.head.repo.full_name == 'gregweir/ai-engine-room'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      AER_SNAPCRAFT_ONE_BUILD_APPROVED: 'true'
      EXPECTED_BASE: ac78d2613c5a5df5e3a9204345273c391c7890e5
      EXPECTED_PROCEDURE_COMMIT: b0f1d8bb5260abf961454ec1f82ec50cc97726d9
      EXPECTED_PROCEDURE_BLOB: 42d4085daab51730d1837b9d1ca18ea6638c58e9
      EXPECTED_DEFINITION_BLOB: ff6d085085ae7dd693e2834541c5b1cb2c3c965c
      EXPECTED_LAUNCHER_BLOB: bd5bc3af83ca13ae29d53e4331255296c1526611
      PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Verify runner and exact execution history
        shell: bash
        run: |
          set -Eeuo pipefail

          printf 'runner_environment=%s\n' "$RUNNER_ENVIRONMENT"
          printf 'runner_os=%s\n' "$RUNNER_OS"
          printf 'runner_arch=%s\n' "$RUNNER_ARCH"
          printf 'image_os=%s\n' "${ImageOS:-unavailable}"
          printf 'image_version=%s\n' "${ImageVersion:-unavailable}"
          uname -a
          cat /etc/os-release
          printf 'dpkg_architecture=%s\n' "$(dpkg --print-architecture)"

          [[ "$RUNNER_ENVIRONMENT" == "github-hosted" ]] || {
            echo 'The runner is not GitHub-hosted.' >&2
            exit 1
          }
          [[ "$RUNNER_OS" == "Linux" && "$RUNNER_ARCH" == "X64" ]] || {
            echo 'The runner is not Linux x64.' >&2
            exit 1
          }
          [[ "$(. /etc/os-release && printf '%s' "$VERSION_ID")" == "24.04" ]] || {
            echo 'The runner is not Ubuntu 24.04.' >&2
            exit 1
          }
          [[ "$(dpkg --print-architecture)" == "amd64" ]] || {
            echo 'The runner package architecture is not amd64.' >&2
            exit 1
          }

          actual_head="$(git rev-parse HEAD)"
          [[ "$actual_head" == "$PR_HEAD_SHA" ]] || {
            echo "Checked-out head mismatch: $actual_head." >&2
            exit 1
          }
          [[ "$PR_BASE_SHA" == "$EXPECTED_BASE" ]] || {
            echo "Pull-request base mismatch: $PR_BASE_SHA." >&2
            exit 1
          }

          actual_parent="$(git rev-parse HEAD^)"
          [[ "$actual_parent" == "$EXPECTED_PROCEDURE_COMMIT" ]] || {
            echo "Workflow parent mismatch: $actual_parent." >&2
            exit 1
          }
          actual_grandparent="$(git rev-parse HEAD^^)"
          [[ "$actual_grandparent" == "$EXPECTED_BASE" ]] || {
            echo "Procedure parent mismatch: $actual_grandparent." >&2
            exit 1
          }

          mapfile -t procedure_paths < <(git diff --name-only "$EXPECTED_BASE" "$EXPECTED_PROCEDURE_COMMIT")
          [[ ${#procedure_paths[@]} -eq 1 && "${procedure_paths[0]}" == "scripts/verify-snapcraft-one-build.sh" ]] || {
            printf 'Unexpected procedure-commit paths: %s\n' "${procedure_paths[*]}" >&2
            exit 1
          }
          mapfile -t workflow_paths < <(git diff --name-only "$EXPECTED_PROCEDURE_COMMIT" HEAD)
          [[ ${#workflow_paths[@]} -eq 1 && "${workflow_paths[0]}" == ".github/workflows/snapcraft-one-build-verification.yml" ]] || {
            printf 'Unexpected workflow-commit paths: %s\n' "${workflow_paths[*]}" >&2
            exit 1
          }
          mapfile -t all_paths < <(git diff --name-only "$EXPECTED_BASE" HEAD | LC_ALL=C sort)
          expected_paths=(
            '.github/workflows/snapcraft-one-build-verification.yml'
            'scripts/verify-snapcraft-one-build.sh'
          )
          [[ "${all_paths[*]}" == "${expected_paths[*]}" ]] || {
            printf 'Unexpected execution-branch paths: %s\n' "${all_paths[*]}" >&2
            exit 1
          }

          [[ "$(git hash-object -- scripts/verify-snapcraft-one-build.sh)" == "$EXPECTED_PROCEDURE_BLOB" ]] || {
            echo 'Procedure blob mismatch.' >&2
            exit 1
          }
          [[ "$(git hash-object -- snap/snapcraft.yaml)" == "$EXPECTED_DEFINITION_BLOB" ]] || {
            echo 'Snapcraft definition blob mismatch.' >&2
            exit 1
          }
          [[ "$(git hash-object -- snap/gui/ai-engine-room.desktop)" == "$EXPECTED_LAUNCHER_BLOB" ]] || {
            echo 'Desktop launcher blob mismatch.' >&2
            exit 1
          }

          procedure='scripts/verify-snapcraft-one-build.sh'
          required_literals=(
            'expected_branch="codex/snapcraft-one-build-execution"'
            'snapcraft expand-extensions'
            'blocked_app_plugs = %w[calendar-service mount-observe]'
            'snapcraft --destructive-mode --build-for=amd64'
            'The local artifact passed the bounded inspection. It was not installed or uploaded.'
          )
          for literal in "${required_literals[@]}"; do
            grep -F -- "$literal" "$procedure" >/dev/null || {
              echo "Required procedure literal is absent: $literal" >&2
              exit 1
            }
          done

      - name: Run the separately approved procedure once
        shell: bash
        run: ./scripts/verify-snapcraft-one-build.sh
