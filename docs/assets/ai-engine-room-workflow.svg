<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="workflow-title workflow-description">
  <title id="workflow-title">AI Engine Room host-led workflow</title>
  <desc id="workflow-description">The main lane shows a user optionally starting a provider, choosing Refresh for passive observation, reviewing Overview and Models, using deterministic Diagnose findings, and previewing or explicitly copying a report. A separate optional lane shows choosing an eligible model, reading a disclosure, authorizing one run, and making one bounded observed-inference attempt with a fixed synthetic prompt.</desc>
  <style>
    .surface { fill: #ffffff; }
    .muted-surface { fill: #f5f5f5; }
    .box { fill: #ffffff; stroke: #dcdcdc; stroke-width: 2; }
    .passive-box { fill: #eef7ef; stroke: #2e7d32; stroke-width: 2; }
    .gate-box { fill: #fff8e8; stroke: #8d6e63; stroke-width: 2; }
    .text { fill: #1a1a1a; font-family: system-ui, sans-serif; }
    .muted { fill: #555555; font-family: system-ui, sans-serif; }
    .line { fill: none; stroke: #616161; stroke-width: 3; marker-end: url(#arrow); }
    .gate-line { fill: none; stroke: #8d6e63; stroke-width: 3; stroke-dasharray: 8 6; marker-end: url(#gate-arrow); }
    .arrow-fill { fill: #616161; }
    .gate-arrow-fill { fill: #8d6e63; }
    .divider { stroke: #dcdcdc; stroke-width: 2; }
    @media (prefers-color-scheme: dark) {
      .surface { fill: #1e1e1e; }
      .muted-surface { fill: #262626; }
      .box { fill: #1e1e1e; stroke: #3a3a3a; }
      .passive-box { fill: #233327; stroke: #81c784; }
      .gate-box { fill: #332e26; stroke: #bcaaa4; }
      .text { fill: #eaeaea; }
      .muted { fill: #b0b0b0; }
      .line { stroke: #bdbdbd; }
      .gate-line { stroke: #bcaaa4; }
      .arrow-fill { fill: #bdbdbd; }
      .gate-arrow-fill { fill: #bcaaa4; }
      .divider { stroke: #3a3a3a; }
    }
  </style>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path class="arrow-fill" d="M0,0 L0,6 L9,3 z"/>
    </marker>
    <marker id="gate-arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path class="gate-arrow-fill" d="M0,0 L0,6 L9,3 z"/>
    </marker>
  </defs>

  <rect class="surface" width="1200" height="620"/>
  <text class="text" x="50" y="52" font-size="29" font-weight="600">How AI Engine Room stays host-led</text>
  <text class="muted" x="50" y="82" font-size="17">Passive observation is the normal path. Inference requires a separate decision for each run.</text>

  <text class="text" x="50" y="128" font-size="19" font-weight="600">Passive observation</text>

  <rect class="box" x="50" y="150" width="190" height="115" rx="10"/>
  <text class="text" x="145" y="184" font-size="18" font-weight="600" text-anchor="middle">Start a provider</text>
  <text class="muted" x="145" y="213" font-size="15" text-anchor="middle">Optional</text>
  <text class="muted" x="145" y="238" font-size="15" text-anchor="middle">You control it</text>

  <path class="line" d="M240 207 H270"/>

  <rect class="passive-box" x="280" y="150" width="190" height="115" rx="10"/>
  <text class="text" x="375" y="184" font-size="18" font-weight="600" text-anchor="middle">Refresh</text>
  <text class="muted" x="375" y="213" font-size="15" text-anchor="middle">Reacquire evidence</text>
  <text class="muted" x="375" y="238" font-size="15" text-anchor="middle">No inference</text>

  <path class="line" d="M470 207 H500"/>

  <rect class="box" x="510" y="150" width="190" height="115" rx="10"/>
  <text class="text" x="605" y="184" font-size="18" font-weight="600" text-anchor="middle">Review</text>
  <text class="muted" x="605" y="213" font-size="15" text-anchor="middle">Overview + Models</text>
  <text class="muted" x="605" y="238" font-size="15" text-anchor="middle">Unknown stays visible</text>

  <path class="line" d="M700 207 H730"/>

  <rect class="box" x="740" y="150" width="190" height="115" rx="10"/>
  <text class="text" x="835" y="184" font-size="18" font-weight="600" text-anchor="middle">Diagnose</text>
  <text class="muted" x="835" y="213" font-size="15" text-anchor="middle">Factual meaning</text>
  <text class="muted" x="835" y="238" font-size="15" text-anchor="middle">Safe next check</text>

  <path class="line" d="M930 207 H960"/>

  <rect class="box" x="970" y="150" width="180" height="115" rx="10"/>
  <text class="text" x="1060" y="184" font-size="18" font-weight="600" text-anchor="middle">Report</text>
  <text class="muted" x="1060" y="213" font-size="15" text-anchor="middle">Preview first</text>
  <text class="muted" x="1060" y="238" font-size="15" text-anchor="middle">Copy is explicit</text>

  <line class="divider" x1="50" y1="310" x2="1150" y2="310"/>
  <text class="text" x="50" y="352" font-size="19" font-weight="600">Optional observed inference — a separate gate for every run</text>

  <rect class="gate-box" x="50" y="378" width="240" height="105" rx="10"/>
  <text class="text" x="170" y="414" font-size="18" font-weight="600" text-anchor="middle">Choose an eligible model</text>
  <text class="muted" x="170" y="446" font-size="15" text-anchor="middle">Ollama or LM Studio</text>

  <path class="gate-line" d="M290 430 H330"/>

  <rect class="gate-box" x="340" y="378" width="220" height="105" rx="10"/>
  <text class="text" x="450" y="414" font-size="18" font-weight="600" text-anchor="middle">Read the disclosure</text>
  <text class="muted" x="450" y="446" font-size="15" text-anchor="middle">Know what may happen</text>

  <path class="gate-line" d="M560 430 H600"/>

  <rect class="gate-box" x="610" y="378" width="220" height="105" rx="10"/>
  <text class="text" x="720" y="414" font-size="18" font-weight="600" text-anchor="middle">Authorize one run</text>
  <text class="muted" x="720" y="446" font-size="15" text-anchor="middle">No permission carries over</text>

  <path class="gate-line" d="M830 430 H870"/>

  <rect class="gate-box" x="880" y="378" width="270" height="105" rx="10"/>
  <text class="text" x="1015" y="414" font-size="18" font-weight="600" text-anchor="middle">One bounded attempt</text>
  <text class="muted" x="1015" y="446" font-size="15" text-anchor="middle">Fixed synthetic prompt; no retry</text>

  <rect class="muted-surface" x="50" y="526" width="1100" height="58" rx="8"/>
  <text class="text" x="600" y="551" font-size="15" font-weight="600" text-anchor="middle">Boundaries stay in force</text>
  <text class="muted" x="600" y="574" font-size="14" text-anchor="middle">Fixed same-machine endpoints • no provider management • no continuous monitoring • no application upload</text>
</svg>
